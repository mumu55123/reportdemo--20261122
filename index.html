<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>台股情報查詢系統</title>

  <style>
    :root {
      font-family: "Microsoft JhengHei", Inter, "Noto Sans TC", sans-serif;
      color: #17251f;
      background: #f4f7f4;
      font-synthesis: none;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
    }

    .top {
      padding: 30px max(22px, calc((100% - 1080px) / 2)) 27px;
      color: #fff;
      background: #133d31;
    }

    .top-inner {
      display: flex;
      max-width: 1080px;
      margin: 0 auto;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .clockbox {
      min-width: 190px;
      text-align: right;
    }

    .clock-label {
      color: #acd4bf;
      font-size: 11px;
      letter-spacing: 0.12em;
    }

    .clock-time {
      color: #fff;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
    }

    .clock-date {
      margin-top: 2px;
      color: #c0d7cb;
      font-size: 12px;
    }

    .brand {
      color: #acd4bf;
      font-size: 12px;
      letter-spacing: 0.14em;
    }

    .top h1 {
      margin: 8px 0 6px;
      font-size: 30px;
    }

    .top p {
      margin: 0;
      color: #c0d7cb;
      font-size: 14px;
    }

    .wrap {
      max-width: 1080px;
      margin: 24px auto;
      padding: 0 18px;
    }

    .searchbox {
      padding: 18px;
      border: 1px solid #e1e9e3;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 5px 18px #152d2410;
    }

    .form {
      display: flex;
      gap: 10px;
    }

    .form input {
      flex: 1;
      min-width: 0;
      padding: 13px 14px;
      border: 1px solid #cfd9d1;
      border-radius: 10px;
      outline: none;
      font-size: 16px;
    }

    .form input:focus {
      border-color: #28765a;
      box-shadow: 0 0 0 3px #28765a20;
    }

    button {
      padding: 0 21px;
      border: 0;
      border-radius: 10px;
      color: #fff;
      background: #176b4c;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #10583d;
    }

    .hint {
      margin: 10px 2px 0;
      color: #75847b;
      font-size: 12px;
    }

    .quick {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 13px;
    }

    .chip {
      padding: 6px 11px;
      border: 1px solid #dce6de;
      border-radius: 99px;
      color: #355848;
      background: #f7faf7;
      font-size: 12px;
      cursor: pointer;
    }

    .chip:hover {
      background: #eaf4ec;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 18px;
    }

    .panel {
      overflow: hidden;
      border: 1px solid #e2e9e4;
      border-radius: 16px;
      background: #fff;
    }

    .panelhead {
      display: flex;
      padding: 18px 20px;
      border-bottom: 1px solid #edf1ee;
      align-items: center;
      justify-content: space-between;
    }

    .panelhead h2 {
      margin: 0;
      font-size: 16px;
    }

    .search-panel .panelhead h2,
    .news-panel .panelhead h2 {
      font-size: 24px;
      font-weight: 700;
    }

    .eyebrow {
      color: #849188;
      font-size: 14px;
    }

    .results {
      min-height: 145px;
      padding: 16px 18px;
    }

    .empty {
      color: #89958e;
      font-size: 14px;
      line-height: 1.8;
    }

    .result {
      padding: 14px 0;
      border-bottom: 1px solid #edf1ee;
      font-family: "Microsoft JhengHei", sans-serif;
    }

    .quote-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin: 12px 0;
    }

    .quote-cell {
      padding: 10px 11px;
      border-radius: 9px;
      background: #f6faf6;
    }

    .quote-label {
      color: #738178;
      font-size: 11px;
    }

    .quote-value {
      margin-top: 4px;
      color: #173d30;
      font-size: 17px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .result:last-child {
      border-bottom: 0;
    }

    .result h3 {
      margin: 0;
      font-size: 16px;
    }

    .result-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .result-title h3 {
      flex: 1;
      min-width: 0;
      font-size: 20px;
    }

    .title-links {
      flex-shrink: 0;
      gap: 5px;
    }

    .title-links .link {
      padding: 5px 7px;
      font-size: 18px;
    }

    .meta {
      color: #738178;
      font-size: 12px;
    }

    .desc {
      margin: 8px 0;
      color: #54645a;
      font-size: 13px;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .link {
      display: inline-flex;
      padding: 6px 9px;
      border: 1px solid #cfe2d4;
      border-radius: 8px;
      color: #176b4c;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
    }

    .link:hover {
      background: #edf7ef;
    }

    .stockrow {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr);
      padding: 11px 0;
      border-bottom: 1px solid #edf1ee;
      align-items: start;
      gap: 10px;
    }

    .stockrow:last-child {
      border: 0;
    }

    .stockquote {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
      margin-top: 12px;
    }

    .stockquote-item {
      min-width: 0;
      padding: 10px 11px;
      border-radius: 9px;
      background: #f6faf6;
    }

    .stockquote-label {
      color: #738178;
      font-size: 10px;
    }

    .stockquote-value {
      margin-top: 4px;
      color: #173d30;
      font-size: 17px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .pending {
      color: #c62828 !important;
    }

    .code {
      padding-top: 5px;
      color: #738178;
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }

    .stockname {
      font-size: 24px;
      font-weight: 700;
    }

    .sector {
      margin-top: 0;
      color: #849188;
      font-size: 20px;
    }

    .stockheading {
      display: flex;
      min-width: 0;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px;
    }

    .smalllinks {
      display: flex;
      flex-shrink: 0;
      margin-left: auto;
      align-items: baseline;
      gap: 6px;
      white-space: nowrap;
    }

    .smalllinks a {
      border-bottom: 1px solid #a9cdb6;
      color: #176b4c;
      font-size: 18px;
      text-decoration: none;
    }

    .news {
      padding: 0 18px 12px;
    }

    .newsitem {
      padding: 12px 0;
      border-bottom: 1px solid #edf1ee;
    }

    .newsitem:last-child {
      border: 0;
    }

    .newsitem b {
      font-size: 14px;
    }

    .newsitem p {
      margin: 5px 0;
      color: #738178;
      font-size: 12px;
    }

    .newsitem a {
      color: #176b4c;
      font-size: 12px;
      text-decoration: none;
    }

    .wide {
      grid-column: 1 / -1;
    }

    .foot {
      padding: 23px 10px 32px;
      color: #89958e;
      font-size: 11px;
      text-align: center;
    }

    .sourcebar {
      display: flex;
      gap: 8px;
    }

    .notice {
      margin-top: 14px;
      padding: 11px 13px;
      border-radius: 9px;
      color: #718078;
      background: #f6faf6;
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .wide {
        grid-column: auto;
      }

      .top {
        padding: 25px 20px;
      }

      .top-inner {
        align-items: flex-start;
      }

      .clockbox {
        min-width: 120px;
      }

      .clock-time {
        font-size: 21px;
      }

      .top h1 {
        font-size: 24px;
      }

      .stockrow {
        grid-template-columns: 42px minmax(0, 1fr);
      }

      .stockheading {
        gap: 6px;
      }

      .smalllinks {
        flex-direction: row;
        gap: 6px;
      }

      .form button {
        padding: 0 14px;
      }
    }
  </style>
</head>

<body>
  <header class="top">
    <div class="top-inner">
      <div class="top-copy">
        <div class="brand">TAIWAN MARKET WATCH</div>
        <h1>台股情報查詢系統</h1>
        <p>查詢上市櫃股票，快速前往 Yahoo 股市與鉅亨網查看資訊</p>
      </div>

      <div class="clockbox">
        <div class="clock-label">台灣時間</div>
        <time class="clock-time" id="taiwanClock">--:--:--</time>
        <div class="clock-date" id="taiwanDate"></div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="searchbox">
      <form class="form" id="searchForm">
        <input
          id="query"
          aria-label="股票代碼或名稱"
          placeholder="輸入股票代碼或名稱，例如 2330、台積電"
          autocomplete="off"
        >
        <button type="submit">搜尋股票</button>
      </form>

      <div class="hint">
        可搜尋台灣上市櫃股票。每日行情與新聞由 GitHub Actions 自動更新。
      </div>
      <div class="quick" id="quick"></div>
    </section>

    <div class="grid">
      <section class="panel search-panel">
        <div class="panelhead">
          <h2>搜尋結果</h2>
          <span class="eyebrow">每日更新</span>
        </div>
        <div class="results" id="results">
          <div class="empty">
            輸入股票代碼或名稱開始搜尋。<br>
            不在觀察清單中的股票，也可直接搜尋 Yahoo 股市與鉅亨網。
          </div>
        </div>
      </section>

      <section class="panel stock-panel">
        <div class="panelhead">
          <h2>股票觀察清單</h2>
          <span class="eyebrow">10 檔常用標的</span>
        </div>
        <div class="results" id="stocks"></div>
      </section>

      <section class="panel wide news-panel">
        <div class="panelhead">
          <h2>每日國際政經新聞</h2>
          <span class="eyebrow">每日自動擷取</span>
        </div>
        <div class="news" id="newsfeed">
          <div class="empty">每日資料更新後顯示新聞。</div>
        </div>
      </section>
    </div>

    <footer class="foot">
      <span id="dataTime">每日資料更新中</span>
      · 資料來源：Yahoo 股市、鉅亨網、Reuters、證交所與櫃買中心
    </footer>
  </main>

  <script>
    const stocks = [];
    const WATCH_CODES = [
      "2330",
      "2317",
      "2454",
      "2308",
      "2382",
      "2881",
      "2882",
      "3711",
      "2603",
      "3231",
    ];

    const yahooQuoteUrl = (code) =>
      "https://tw.stock.yahoo.com/quote/" + encodeURIComponent(code);

    const cnyesQuoteUrl = (code) =>
      "https://www.cnyes.com/twstock/profile.aspx?code=" +
      encodeURIComponent(code);

    function addLink(parent, label, url) {
      const link = document.createElement("a");
      link.className = "link";
      link.href = url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = label + " ↗";
      parent.append(link);
    }

    function formatPrice(value) {
      if (value == null) {
        return "尚無資料";
      }

      return (
        "NT$ " +
        Number(value).toLocaleString("zh-TW", {
          minimumFractionDigits: 1,
          maximumFractionDigits: 1,
        })
      );
    }

    async function loadData() {
      const dataTime = document.getElementById("dataTime");

      try {
        const [stockResponse, newsResponse] = await Promise.all([
          fetch("./data/stocks.json?ts=" + Date.now()),
          fetch("./data/news.json?ts=" + Date.now()),
        ]);

        if (!stockResponse.ok) {
          throw new Error("無法載入股票資料");
        }

        const stockData = await stockResponse.json();
        stocks.splice(0, stocks.length, ...(stockData.items || []));

        drawStocks();

        if (newsResponse.ok) {
          const newsData = await newsResponse.json();
          renderNews(newsData);
        }

        dataTime.textContent = stockData.updatedAt
          ? "資料更新：" +
            new Date(stockData.updatedAt).toLocaleString("zh-TW", {
              timeZone: "Asia/Taipei",
            })
          : "等待每日資料更新";
      } catch (error) {
        dataTime.textContent = "資料載入中或暫時無法取得，請稍後重新整理。";
      }
    }

    function createStockQuoteItem(label, value, pending) {
      const item = document.createElement("div");
      item.className = "stockquote-item";

      const caption = document.createElement("div");
      caption.className = "stockquote-label";
      caption.textContent = label;

      const price = document.createElement("div");
      price.className = "stockquote-value";

      if (pending) {
        price.classList.add("pending");
      }

      price.textContent = pending ? "尚未收盤" : formatPrice(value);
      item.append(caption, price);

      return item;
    }

    function drawStocks() {
      const root = document.getElementById("stocks");
      root.replaceChildren();

      WATCH_CODES.forEach((code) => {
        const stock = stocks.find((item) => item.code === code);

        if (!stock) {
          return;
        }

        const row = document.createElement("div");
        row.className = "stockrow";

        const codeLabel = document.createElement("div");
        codeLabel.className = "code";
        codeLabel.textContent = stock.code;

        const info = document.createElement("div");

        const name = document.createElement("div");
        name.className = "stockname";
        name.textContent = stock.name;

        const sector = document.createElement("div");
        sector.className = "sector";
        sector.textContent = stock.sector;

        const links = document.createElement("div");
        links.className = "smalllinks";

        const yahooLink = document.createElement("a");
        yahooLink.href = yahooQuoteUrl(stock.code);
        yahooLink.target = "_blank";
        yahooLink.rel = "noopener noreferrer";
        yahooLink.textContent = "Yahoo";

        const cnyesLink = document.createElement("a");
        cnyesLink.href = cnyesQuoteUrl(stock.code);
        cnyesLink.target = "_blank";
        cnyesLink.rel = "noopener noreferrer";
        cnyesLink.textContent = "鉅亨";

        links.append(yahooLink, cnyesLink);

        const heading = document.createElement("div");
        heading.className = "stockheading";
        heading.append(name, sector, links);

        const quote = document.createElement("div");
        quote.className = "stockquote";
        quote.append(
          createStockQuoteItem("今日開盤", stock.open, false),
          createStockQuoteItem("今日收盤", stock.close, !stock.marketClosed),
          createStockQuoteItem("今日高點", stock.high, false),
          createStockQuoteItem("今日低點", stock.low, false),
        );

        info.append(heading, quote);
        row.append(codeLabel, info);
        root.append(row);
      });
    }

    function search(query) {
      const keyword = query.trim();

      if (!keyword) {
        return;
      }

      const root = document.getElementById("results");
      root.replaceChildren();

      const matches = stocks
        .filter(
          (stock) =>
            stock.code.includes(keyword) || stock.name.includes(keyword),
        )
        .slice(0, 8);

      if (matches.length === 0) {
        const message = document.createElement("div");
        message.className = "empty";
        message.textContent =
          "資料清單中找不到此股票。你仍可用外部網站搜尋：";

        const links = document.createElement("div");
        links.className = "links";

        addLink(
          links,
          "Yahoo 股市搜尋",
          "https://tw.stock.yahoo.com/search?query=" +
            encodeURIComponent(keyword),
        );
        addLink(
          links,
          "鉅亨網搜尋",
          "https://www.cnyes.com/search?keyword=" +
            encodeURIComponent(keyword),
        );

        root.append(message, links);
        return;
      }

      matches.forEach((stock) => {
        const card = document.createElement("div");
        card.className = "result";

        const titleRow = document.createElement("div");
        titleRow.className = "result-title";

        const title = document.createElement("h3");
        title.textContent = stock.code + "　" + stock.name;

        const links = document.createElement("div");
        links.className = "links title-links";
        addLink(links, "Yahoo", yahooQuoteUrl(stock.code));
        addLink(links, "鉅亨網", cnyesQuoteUrl(stock.code));
        titleRow.append(title, links);

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = "概念股分類：" + stock.sector;

        const quoteGrid = document.createElement("div");
        quoteGrid.className = "quote-grid";

        const quoteItems = [
          ["當日開盤", stock.open, false],
          ["當日收盤", stock.close, !stock.marketClosed],
          ["當日高點", stock.high, false],
          ["當日低點", stock.low, false],
          ["昨日收盤", stock.previousClose, false],
        ];

        quoteItems.forEach(([label, value, pending]) => {
          const cell = document.createElement("div");
          cell.className = "quote-cell";

          const caption = document.createElement("div");
          caption.className = "quote-label";
          caption.textContent = label;

          const price = document.createElement("div");
          price.className = "quote-value";

          if (pending) {
            price.classList.add("pending");
          }

          price.textContent = pending ? "尚未收盤" : formatPrice(value);
          cell.append(caption, price);
          quoteGrid.append(cell);
        });

        card.append(titleRow, meta, quoteGrid);
        root.append(card);
      });
    }

    function renderNews(data) {
      const root = document.getElementById("newsfeed");
      root.replaceChildren();

      if (!data.items || data.items.length === 0) {
        const message = document.createElement("div");
        message.className = "empty";
        message.textContent = "指定時段內尚無符合條件的新聞。";
        root.append(message);
        return;
      }

      data.items.slice(0, 5).forEach((item) => {
        const row = document.createElement("div");
        row.className = "newsitem";

        const title = document.createElement("b");
        title.textContent = item.title;

        const metadata = document.createElement("p");
        metadata.textContent =
          item.source +
          " · " +
          new Date(item.published).toLocaleString("zh-TW", {
            timeZone: "Asia/Taipei",
          });

        const link = document.createElement("a");
        link.href = item.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "閱讀原文 ↗";

        row.append(title, metadata, link);
        root.append(row);
      });

      const note = document.createElement("div");
      note.className = "notice";
      note.textContent =
        "擷取範圍：前一日 13:30 至當日 09:00（台北時間）。至多 5 則。";
      root.append(note);
    }

    function updateTaiwanClock() {
      const now = new Date();

      document.getElementById("taiwanClock").textContent =
        new Intl.DateTimeFormat("zh-TW", {
          timeZone: "Asia/Taipei",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false,
        }).format(now);

      document.getElementById("taiwanDate").textContent =
        new Intl.DateTimeFormat("zh-TW", {
          timeZone: "Asia/Taipei",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          weekday: "long",
        }).format(now);
    }

    document.getElementById("searchForm").addEventListener("submit", (event) => {
      event.preventDefault();
      search(document.getElementById("query").value);
    });

    const quickLinks = document.getElementById("quick");
    const featuredStocks = [
      ["2330", "台積電"],
      ["2317", "鴻海"],
      ["2454", "聯發科"],
      ["2881", "富邦金"],
    ];

    featuredStocks.forEach(([code, name]) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "chip";
      button.textContent = code + " " + name;
      button.addEventListener("click", () => {
        document.getElementById("query").value = code;
        search(code);
      });
      quickLinks.append(button);
    });

    updateTaiwanClock();
    setInterval(updateTaiwanClock, 1000);
    loadData();
    setInterval(loadData, 10 * 60 * 1000);
  </script>
</body>
</html>
