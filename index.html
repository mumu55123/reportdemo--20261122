<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>台股情報查詢系統</title>
<style>
:root{font-family:"Microsoft JhengHei",Inter,"Noto Sans TC",sans-serif;color:#17251f;background:#f4f7f4;font-synthesis:none}*{box-sizing:border-box}body{margin:0}.top{background:#133d31;color:#fff;padding:30px max(22px,calc((100% - 1080px)/2)) 27px}.brand{font-size:12px;letter-spacing:.14em;color:#acd4bf}.top h1{margin:8px 0 6px;font-size:28px}.top p{margin:0;color:#c0d7cb;font-size:14px}.wrap{max-width:1080px;margin:24px auto;padding:0 18px}.searchbox{background:white;border:1px solid #e1e9e3;border-radius:16px;padding:18px;box-shadow:0 5px 18px #152d2410}.form{display:flex;gap:10px}.form input{flex:1;min-width:0;padding:13px 14px;border:1px solid #cfd9d1;border-radius:10px;font-size:16px;outline:none}.form input:focus{border-color:#28765a;box-shadow:0 0 0 3px #28765a20}button{border:0;border-radius:10px;padding:0 21px;background:#176b4c;color:white;font-size:15px;font-weight:700;cursor:pointer}button:hover{background:#10583d}.hint{color:#75847b;font-size:12px;margin:10px 2px 0}.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.chip{border:1px solid #dce6de;background:#f7faf7;color:#355848;border-radius:99px;padding:6px 11px;font-size:12px;cursor:pointer}.chip:hover{background:#eaf4ec}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.panel{background:#fff;border:1px solid #e2e9e4;border-radius:16px;overflow:hidden}.panelhead{padding:16px 18px;border-bottom:1px solid #edf1ee;display:flex;align-items:center;justify-content:space-between}.panelhead h2{font-size:16px;margin:0}.eyebrow{color:#849188;font-size:11px}.results{padding:16px 18px;min-height:145px}.empty{color:#89958e;font-size:14px;line-height:1.8}.result{font-family:"Microsoft JhengHei",sans-serif;padding:14px 0;border-bottom:1px solid #edf1ee}.quote-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}.quote-cell{background:#f6faf6;border-radius:9px;padding:10px 11px}.quote-label{font-size:11px;color:#738178}.quote-value{font-size:17px;font-weight:700;color:#173d30;margin-top:4px;font-variant-numeric:tabular-nums}.result:last-child{border-bottom:0}.result h3{margin:0 0 5px;font-size:16px}.meta{font-size:12px;color:#738178}.desc{font-size:13px;color:#54645a;margin:8px 0}.links{display:flex;gap:8px;flex-wrap:wrap}.link{display:inline-flex;text-decoration:none;color:#176b4c;border:1px solid #cfe2d4;border-radius:8px;padding:6px 9px;font-size:12px;font-weight:600}.link:hover{background:#edf7ef}.stockrow{display:grid;grid-template-columns:68px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #edf1ee}.stockrow:last-child{border:0}.code{font-size:12px;color:#738178;font-variant-numeric:tabular-nums}.stockname{font-weight:700;font-size:14px}.sector{font-size:11px;color:#849188;margin-top:3px}.smalllinks{display:flex;gap:6px}.smalllinks a{font-size:11px;color:#176b4c;text-decoration:none;border-bottom:1px solid #a9cdb6}.news{padding:0 18px 12px}.newsitem{padding:12px 0;border-bottom:1px solid #edf1ee}.newsitem:last-child{border:0}.newsitem b{font-size:14px}.newsitem p{margin:5px 0;color:#738178;font-size:12px}.newsitem a{font-size:12px;color:#176b4c;text-decoration:none}.wide{grid-column:1/-1}.foot{text-align:center;color:#89958e;font-size:11px;padding:23px 10px 32px}.sourcebar{display:flex;gap:8px}.notice{margin-top:14px;padding:11px 13px;background:#f6faf6;color:#718078;border-radius:9px;font-size:12px;line-height:1.6}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.top{padding:25px 20px}.top h1{font-size:24px}.stockrow{grid-template-columns:55px 1fr auto}.smalllinks{flex-direction:column;gap:2px}.form button{padding:0 14px}}
</style></head>
<body><header class="top"><div class="brand">TAIWAN MARKET WATCH</div><h1>台股情報查詢系統</h1><p>查詢上市櫃股票，快速前往 Yahoo 股市與鉅亨網查看資訊</p></header>
<main class="wrap"><section class="searchbox"><form class="form" id="searchForm"><input id="query" aria-label="股票代碼或名稱" placeholder="輸入股票代碼或名稱，例如 2330、台積電" autocomplete="off"><button type="submit">搜尋股票</button></form><div class="hint">可搜尋台灣上市櫃股票。每日行情與新聞由 GitHub Actions 自動更新。</div><div class="quick" id="quick"></div></section>
<div class="grid"><section class="panel"><div class="panelhead"><h2>搜尋結果</h2><span class="eyebrow">每日更新</span></div><div class="results" id="results"><div class="empty">輸入股票代碼或名稱開始搜尋。<br>不在觀察清單中的股票，也可直接搜尋 Yahoo 股市與鉅亨網。</div></div></section>
<section class="panel"><div class="panelhead"><h2>股票觀察清單</h2><span class="eyebrow">10 檔常用標的</span></div><div class="results" id="stocks"></div></section>
<section class="panel wide"><div class="panelhead"><h2>每日國際政經新聞</h2><span class="eyebrow">最多 5 則 · 每日自動擷取</span></div><div class="news" id="newsfeed"><div class="empty">每日資料更新後顯示新聞。</div></div></section></div><footer class="foot"><span id="dataTime">每日資料更新中</span>　·　資料來源：Yahoo 股市、鉅亨網、Reuters、證交所與櫃買中心</footer></main>
<script>
const stocks=[];const yahoo=q=>'https://tw.stock.yahoo.com/quote/'+encodeURIComponent(q);const cnyes=q=>'https://www.cnyes.com/twstock/profile.aspx?code='+encodeURIComponent(q);
function addLink(parent,label,url){const a=document.createElement('a');a.className='link';a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=label+' ↗';parent.append(a)}
function money(v){return v==null?'尚無資料':'NT$ '+Number(v).toLocaleString('zh-TW',{minimumFractionDigits:2,maximumFractionDigits:2})}
async function loadData(){try{const [sr,nr]=await Promise.all([fetch('./data/stocks.json?ts='+Date.now()),fetch('./data/news.json?ts='+Date.now())]);if(!sr.ok)throw Error('stock data');const sd=await sr.json();stocks.splice(0,stocks.length,...(sd.items||[]));drawStocks();if(nr.ok)renderNews(await nr.json());document.getElementById('dataTime').textContent=sd.updatedAt?'資料更新：'+new Date(sd.updatedAt).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}):'等待每日資料更新'}catch(e){document.getElementById('dataTime').textContent='資料載入中或暫時無法取得，請稍後重新整理。'}}
function drawStocks(){const root=document.getElementById('stocks');root.replaceChildren();const watch=['2330','2317','2454','2308','2382','2881','2882','3711','2603','3231'];watch.forEach(code=>{const s=stocks.find(x=>x.code===code);if(!s)return;const row=document.createElement('div');row.className='stockrow';const c=document.createElement('div');c.className='code';c.textContent=s.code;const info=document.createElement('div');const n=document.createElement('div');n.className='stockname';n.textContent=s.name;const sector=document.createElement('div');sector.className='sector';sector.textContent=s.sector;info.append(n,sector);const links=document.createElement('div');links.className='smalllinks';const y=document.createElement('a');y.href=yahoo(s.code);y.target='_blank';y.rel='noopener';y.textContent='Yahoo';const a=document.createElement('a');a.href=cnyes(s.code);a.target='_blank';a.rel='noopener';a.textContent='鉅亨';links.append(y,a);row.append(c,info,links);root.append(row)})}
function search(q){q=q.trim();if(!q)return;const root=document.getElementById('results');root.replaceChildren();const found=stocks.filter(s=>s.code.includes(q)||s.name.includes(q)).slice(0,8);if(!found.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='資料清單中找不到此股票。你仍可用外部網站搜尋：';const links=document.createElement('div');links.className='links';addLink(links,'Yahoo 股市搜尋','https://tw.stock.yahoo.com/search?query='+encodeURIComponent(q));addLink(links,'鉅亨網搜尋','https://www.cnyes.com/search?keyword='+encodeURIComponent(q));root.append(empty,links);return}found.forEach(s=>{const card=document.createElement('div');card.className='result';const h=document.createElement('h3');h.textContent=s.code+'　'+s.name;const meta=document.createElement('div');meta.className='meta';meta.textContent='概念股分類：'+s.sector;const grid=document.createElement('div');grid.className='quote-grid';[['當日開盤',s.open],['昨日收盤',s.previousClose]].forEach(([label,value])=>{const cell=document.createElement('div');cell.className='quote-cell';const l=document.createElement('div');l.className='quote-label';l.textContent=label;const v=document.createElement('div');v.className='quote-value';v.textContent=money(value);cell.append(l,v);grid.append(cell)});const links=document.createElement('div');links.className='links';addLink(links,'Yahoo 個股報價',yahoo(s.code));addLink(links,'鉅亨網個股報價',cnyes(s.code));card.append(h,meta,grid,links);root.append(card)})}
function renderNews(data){const root=document.getElementById('newsfeed');root.replaceChildren();if(!data.items||!data.items.length){const e=document.createElement('div');e.className='empty';e.textContent='指定時段內尚無符合條件的新聞。';root.append(e);return}data.items.slice(0,5).forEach(item=>{const row=document.createElement('div');row.className='newsitem';const title=document.createElement('b');title.textContent=item.title;const p=document.createElement('p');p.textContent=item.source+' · '+new Date(item.published).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'});const a=document.createElement('a');a.href=item.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='閱讀原文 ↗';row.append(title,p,a);root.append(row)});const note=document.createElement('div');note.className='notice';note.textContent='擷取範圍：前一平日 13:30 至當日 09:00（台北時間）。篩選國際政經，排除股市漲跌、開收盤與指數走勢；最多 5 則。';root.append(note)}
document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();search(document.getElementById('query').value)});const quick=document.getElementById('quick');[['2330','台積電'],['2317','鴻海'],['2454','聯發科'],['2881','富邦金']].forEach(([code,name])=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=code+' '+name;b.addEventListener('click',()=>{document.getElementById('query').value=code;search(code)});quick.append(b)});loadData();setInterval(loadData,5*60*1000);
</script></body></html>
