name: Update daily data and publish site

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # 台北時間：平日盤中每 5 分鐘更新一次。
    - cron: '*/5 9-12 * * 1-5'
      timezone: 'Asia/Taipei'
    - cron: '0,5,10,15,20,25,30 13 * * 1-5'
      timezone: 'Asia/Taipei'
    # 平日非盤中與週末每 10 分鐘更新一次。
    - cron: '*/10 0-8 * * 1-5'
      timezone: 'Asia/Taipei'
    - cron: '40,50 13 * * 1-5'
      timezone: 'Asia/Taipei'
    - cron: '*/10 14-23 * * 1-5'
      timezone: 'Asia/Taipei'
    - cron: '*/10 * * * 0,6'
      timezone: 'Asia/Taipei'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Python for hosted data collection
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect news and Taiwan stock snapshot
        run: python scripts/update_data.py
      - name: Prepare static site files
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/stocks.json data/news.json _site/data/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v4
